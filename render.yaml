services:
  - type: web
    name: sila-billing-backend
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: gen-lang-client-0982515821
      - key: FIREBASE_DATABASE_ID
        value: ai-studio-49352535-85f6-4187-bf2b-3e420dac8a25
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_CREDENTIALS_BASE64
        sync: false
      - key: CORS_ORIGINS
        sync: false
