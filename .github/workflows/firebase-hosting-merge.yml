name: Deploy SILA-Billing Frontend to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build PWA Frontend (Vite)
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Verify Firebase Service Account Secret
        env:
          FB_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0982515821 }}
        run: |
          if [ -z "$FB_SA" ]; then
            echo "::error::Secret do Firebase ausente no GitHub! Vá a Settings > Secrets and variables > Actions e crie o Repository Secret 'FIREBASE_SERVICE_ACCOUNT' com o conteúdo JSON da sua Service Account."
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0982515821 }}
          channelId: live
          projectId: gen-lang-client-0982515821
