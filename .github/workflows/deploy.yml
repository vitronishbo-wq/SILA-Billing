name: Automacao Total SILA-Billing

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar o Bun Runtime
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Instalar Dependencias e Gerar Build PWA
        run: |
          bun install
          bun run build

      - name: Gravar e Validar Credenciais do Firebase Service Account
        shell: bash
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ID }}
        run: |
          node -e '
          const fs = require("fs");
          const crypto = require("crypto");
          const raw = (process.env.FIREBASE_SA_JSON || "").trim();
          if (!raw) {
            console.error("::error::Secret FIREBASE_SERVICE_ACCOUNT_ID nao esta configurado.");
            process.exit(1);
          }
          let candidate = raw;
          if (!candidate.startsWith("{")) {
            try {
              candidate = Buffer.from(
                candidate.replace(/\s+/g, "").replace(/-/g, "+").replace(/_/g, "/"),
                "base64"
              ).toString("utf8").trim();
              if (!candidate.startsWith("{")) {
                throw new Error("Conteudo descodificado invalido");
              }
            } catch (err) {
              console.error("::error::Secret invalido: JSON ou Base64 malformado.");
              process.exit(1);
            }
          }
          let parsed;
          try {
            parsed = JSON.parse(candidate);
          } catch (err) {
            console.error("::error::O Secret nao contem JSON valido.");
            process.exit(1);
          }
          if (!parsed || typeof parsed !== "object" || !parsed.project_id || !parsed.client_email || !parsed.private_key) {
            console.error("::error::Credenciais incompletas ou invalidas.");
            process.exit(1);
          }
          parsed.private_key = parsed.private_key.replace(/\\n/g, "\n");
          try {
            const privateKey = crypto.createPrivateKey(parsed.private_key);
            if (privateKey.asymmetricKeyType !== "rsa") {
              throw new Error("A chave nao e RSA.");
            }
          } catch (err) {
            console.error("::error::A chave privada PEM e invalida ou esta corrompida.");
            process.exit(1);
          }
          const keyPath = `${process.env.RUNNER_TEMP}/gcp_key.json`;
          try {
            fs.writeFileSync(keyPath, JSON.stringify(parsed, null, 2), { mode: 0o600, flag: "w" });
            fs.appendFileSync(process.env.GITHUB_ENV, `GOOGLE_APPLICATION_CREDENTIALS=${keyPath}\n`);
          } catch (err) {
            console.error("::error::Falha ao guardar as credenciais.");
            process.exit(1);
          }
          console.log("Credenciais do Service Account validadas com sucesso.");
          '

      - name: Deploy para o Firebase Hosting e Regras do Firestore
        uses: w9jds/firebase-action@v2.3.0
        with:
          args: deploy --only hosting,firestore:rules --project gen-lang-client-0982515821
        env:
          GCP_SA_KEY: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Disparar Atualizacao Automatica no Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
