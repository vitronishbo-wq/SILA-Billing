- name: Gravar Credenciais do Firebase Service Account
        shell: bash
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ID }}
          KEY_OUT: ${{ runner.temp }}/gcp_key.json
        run: |
          node -e '
            const fs = require("fs");
            let raw = (process.env.FIREBASE_SA_JSON || "").trim();
            if (!raw) {
              console.error("::error::Secret FIREBASE_SERVICE_ACCOUNT_ID em falta.");
              process.exit(1);
            }

            // Se for Base64, converte para texto
            if (!raw.startsWith("{")) {
              raw = Buffer.from(raw.replace(/\s+/g, ""), "base64").toString("utf8");
            }

            let parsed;
            try {
              parsed = JSON.parse(raw);
            } catch (e) {
              // Fallback seguro caso haja quebras de linha literais nas strings
              const fixed = raw.replace(/\n/g, "\\n").replace(/\r/g, "");
              parsed = JSON.parse(fixed);
            }

            // Normaliza o formato PEM da chave privada
            if (parsed.private_key) {
              parsed.private_key = parsed.private_key.replace(/\\n/g, "\n");
            }

            fs.writeFileSync(process.env.KEY_OUT, JSON.stringify(parsed, null, 2), { mode: 0o600 });
            fs.appendFileSync(process.env.GITHUB_ENV, `GOOGLE_APPLICATION_CREDENTIALS=${process.env.KEY_OUT}\n`);
            console.log("Credenciais validadas com sucesso para:", parsed.client_email);
          '