name: Automacao Total SILA-Billing

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar o Bun Runtime
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Instalar Dependencias e Gerar Build PWA
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
        run: |
          bun install
          bun run build

      - name: Gravar Credenciais do Firebase Service Account
        shell: bash
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ID }}
          KEY_OUT: ${{ runner.temp }}/gcp_key.json
        run: |
          node -e '
          const fs = require("node:fs");
          let raw = (process.env.FIREBASE_SA_JSON || "").trim();
          if (!raw) {
            console.error("::error::Secret Firebase ausente.");
            process.exit(1);
          }
          let credentials;
          try {
            credentials = JSON.parse(raw);
            if (typeof credentials === "string") {
              credentials = JSON.parse(credentials);
            }
          } catch (err) {
            console.error(`::error::Secret não contém um JSON válido: ${err.message}`);
            process.exit(1);
          }
          if (credentials.type !== "service_account" || !credentials.project_id || !credentials.private_key) {
            console.error("::error::Credenciais incompletas ou inválidas.");
            process.exit(1);
          }
          credentials.private_key = credentials.private_key.replace(/\\n/g, "\n");
          try {
            fs.writeFileSync(process.env.KEY_OUT, JSON.stringify(credentials), { mode: 0o600 });
            fs.appendFileSync(process.env.GITHUB_ENV, `GOOGLE_APPLICATION_CREDENTIALS=${process.env.KEY_OUT}\n`);
            console.log("Credenciais Firebase gravadas com sucesso.");
          } catch (err) {
            console.error(`::error::Falha ao guardar as credenciais: ${err.message}`);
            process.exit(1);
          }
          '

      - name: Provisionar Canal Hosting (Obrigatorio para Projetos Novos)
        run: |
          npx --yes firebase-tools@15.34.0 hosting:sites:create silabilling --project gen-lang-client-0982515821 --non-interactive || echo "Site já provisionado ou existente."

      - name: Deploy para o Firebase Hosting e Regras do Firestore
        run: |
          npx --yes firebase-tools@15.34.0 deploy --only hosting:silabilling,firestore:rules --project gen-lang-client-0982515821 --non-interactive

      - name: Disparar Atualizacao Automatica no Render
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          else
            echo "RENDER_DEPLOY_HOOK_URL não definido; o Render atualizará via autoDeploy do GitHub."
          fi
