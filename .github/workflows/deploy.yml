
name: Automacao Total SILA-Billing

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar Dependencias e Gerar Build PWA
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Gravar e Validar Credenciais Firebase
        shell: bash
        env:
          FIREBASE_SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ID }}
          KEY_OUT: ${{ runner.temp }}/gcp_key.json
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");

          let raw = (process.env.FIREBASE_SA_JSON || "").trim();

          if (!raw) {
            console.error("::error::Secret FIREBASE_SERVICE_ACCOUNT_ID ausente.");
            process.exit(1);
          }

          if (!raw.startsWith("{")) {
            try {
              const decoded = Buffer.from(
                raw.replace(/\s+/g, "").replace(/-/g, "+").replace(/_/g, "/"),
                "base64"
              ).toString("utf8").trim();

              if (!decoded.startsWith("{")) {
                throw new Error("JSON inválido");
              }

              raw = decoded;
            } catch {
              console.error("::error::O Secret não é JSON nem Base64 válido.");
              process.exit(1);
            }
          }

          let credentials;

          try {
            credentials = JSON.parse(raw);
          } catch {
            console.error("::error::JSON das credenciais inválido.");
            process.exit(1);
          }

          if (
            !credentials ||
            credentials.type !== "service_account" ||
            typeof credentials.project_id !== "string" ||
            typeof credentials.client_email !== "string" ||
            typeof credentials.private_key !== "string"
          ) {
            console.error("::error::Credenciais de Service Account incompletas.");
            process.exit(1);
          }

          credentials.private_key =
            credentials.private_key.replace(/\\n/g, "\n");

          try {
            const key = crypto.createPrivateKey(credentials.private_key);

            if (key.asymmetricKeyType !== "rsa") {
              throw new Error("A chave não é RSA.");
            }
          } catch {
            console.error("::error::Chave privada inválida.");
            process.exit(1);
          }

          if (!process.env.GITHUB_ENV || !process.env.KEY_OUT) {
            console.error("::error::Ambiente GitHub Actions incompleto.");
            process.exit(1);
          }

          try {
            fs.writeFileSync(
              process.env.KEY_OUT,
              JSON.stringify(credentials),
              { mode: 0o600, flag: "w" }
            );

            fs.appendFileSync(
              process.env.GITHUB_ENV,
              `GOOGLE_APPLICATION_CREDENTIALS=${process.env.KEY_OUT}\n`
            );
          } catch {
            console.error("::error::Falha ao guardar as credenciais.");
            process.exit(1);
          }

          console.log("Credenciais validadas.");
          NODE

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy para Firebase Hosting e Firestore Rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp_key.json
        run: |
          firebase deploy \
            --only hosting,firestore:rules \
            --project gen-lang-client-0982515821 \
            --non-interactive

      - name: Disparar Atualizacao no Render
        if: success() && secrets.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"
