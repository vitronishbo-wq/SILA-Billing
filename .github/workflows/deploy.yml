name: Automacao Total SILA-Billing

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configurar o Bun Runtime
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Instalar Dependencias e Gerar Build PWA
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL || 'https://sila-billing.onrender.com' }}
        run: |
          bun install
          bun run build

      - name: Validar Criptograficamente e Gravar Service Account do Firebase
        shell: bash
        env:
          FIREBASE_SA_RAW: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ID }}
          KEY_OUT: ${{ runner.temp }}/gcp_key.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");

          let candidate = (process.env.FIREBASE_SA_RAW || "").trim();
          if (!candidate) {
            console.error("::error::Secret FIREBASE_SERVICE_ACCOUNT_ID ausente.");
            process.exit(1);
          }

          if (
            (candidate.startsWith("\x27") && candidate.endsWith("\x27")) ||
            (candidate.startsWith("\"") && candidate.endsWith("\""))
          ) {
            candidate = candidate.slice(1, -1).trim();
          }

          if (!candidate.startsWith("{") && !candidate.startsWith("{\\\"")) {
            const cleanB64 = candidate.replace(/\s+/g, "");
            const decoded = Buffer.from(cleanB64, "base64").toString("utf-8").trim();
            if (decoded.startsWith("{")) {
              candidate = decoded;
            }
          }

          let credentials;
          try {
            const parsed = JSON.parse(candidate);
            credentials = typeof parsed === "string" ? JSON.parse(parsed) : parsed;
          } catch {
            try {
              const sanitized = candidate
                .replace(/\\"/g, "\"")
                .replace(/"((?:\\.|[^"\\])*)"/gs, (m) =>
                  m.replace(/\r/g, "").replace(/\n/g, "\\n").replace(/\t/g, "\\t")
                );
              credentials = JSON.parse(sanitized);
            } catch (err) {
              console.error(`::error::Falha no parsing JSON/Base64 da Service Account: ${err.message}`);
              process.exit(1);
            }
          }

          if (credentials.type !== "service_account" || !credentials.project_id || !credentials.private_key) {
            console.error("::error::Service Account incompleta (verifique type, project_id e private_key).");
            process.exit(1);
          }

          credentials.private_key = String(credentials.private_key).replace(/\\n/g, "\n");

          try {
            crypto.createPrivateKey({ key: credentials.private_key, format: "pem" });
          } catch (err) {
            console.error(`::error::Falha na validação criptográfica RSA (crypto.createPrivateKey): ${err.message}`);
            process.exit(1);
          }

          fs.writeFileSync(process.env.KEY_OUT, JSON.stringify(credentials), { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_ENV, `GOOGLE_APPLICATION_CREDENTIALS=${process.env.KEY_OUT}\n`);
          console.log(`Service Account validada criptograficamente para o projeto: ${credentials.project_id}`);
          '

      - name: Provisionar Canal Hosting (Obrigatorio para Projetos Novos)
        run: |
          npx --yes firebase-tools@15.34.0 hosting:sites:create silabilling --project gen-lang-client-0982515821 --non-interactive || echo "Site já provisionado ou existente."

      - name: Autorizar Dominio silabilling.web.app no Firebase Authentication
        shell: bash
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");

          (async () => {
            try {
              const credPath = process.env.GOOGLE_APPLICATION_CREDENTIALS;
              const sa = JSON.parse(fs.readFileSync(credPath, "utf-8"));
              const projectId = sa.project_id || "gen-lang-client-0982515821";
              const b64url = (v) => Buffer.from(v).toString("base64").replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
              const now = Math.floor(Date.now() / 1000);
              const unsigned = `${b64url(JSON.stringify({ alg: "RS256", typ: "JWT" }))}.${b64url(JSON.stringify({
                iss: sa.client_email,
                sub: sa.client_email,
                aud: "https://oauth2.googleapis.com/token",
                iat: now,
                exp: now + 3300,
                scope: "https://www.googleapis.com/auth/cloud-platform https://www.googleapis.com/auth/firebase"
              }))}`;
              const signer = crypto.createSign("RSA-SHA256");
              signer.update(unsigned);
              signer.end();
              const assertion = `${unsigned}.${b64url(signer.sign(sa.private_key))}`;

              const tokRes = await fetch("https://oauth2.googleapis.com/token", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({
                  grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
                  assertion
                }).toString()
              });
              const tokJson = await tokRes.json();
              if (!tokJson.access_token) {
                console.warn("::warning::Nao foi possivel obter access_token para Identity Toolkit.");
                return;
              }

              const endpoint = `https://identitytoolkit.googleapis.com/admin/v2/projects/${projectId}/config`;
              const headers = {
                Authorization: `Bearer ${tokJson.access_token}`,
                "X-Goog-User-Project": projectId,
                "Content-Type": "application/json"
              };

              const getRes = await fetch(endpoint, { method: "GET", headers });
              if (!getRes.ok) {
                console.warn(`::warning::Identity Toolkit GET retornou ${getRes.status}. Verifique permissao Firebase Auth Admin da Service Account.`);
                return;
              }

              const cfg = await getRes.json();
              if (!Array.isArray(cfg.authorizedDomains) || cfg.authorizedDomains.length === 0) return;

              const required = ["silabilling.web.app", "silabilling.firebaseapp.com"];
              const missing = required.filter((d) => !cfg.authorizedDomains.includes(d));
              if (missing.length === 0) {
                console.log("Dominios OAuth silabilling.web.app ja autorizados no Firebase Auth.");
                return;
              }

              const merged = Array.from(new Set([...cfg.authorizedDomains, ...missing]));
              const patchRes = await fetch(`${endpoint}?updateMask=authorizedDomains`, {
                method: "PATCH",
                headers,
                body: JSON.stringify({ authorizedDomains: merged })
              });
              if (patchRes.ok) {
                console.log(`Dominios OAuth adicionados automaticamente no Firebase Auth: ${missing.join(", ")}`);
              } else {
                console.warn(`::warning::Identity Toolkit PATCH retornou ${patchRes.status}. Adicione silabilling.web.app manualmente em Authentication -> Settings -> Authorized domains.`);
              }
            } catch (err) {
              console.warn(`::warning::Aviso ao verificar authorizedDomains: ${err.message}`);
            }
          })();
          '

      - name: Deploy para o Firebase Hosting e Regras do Firestore
        run: |
          npx --yes firebase-tools@15.34.0 deploy --only hosting:silabilling,firestore:rules --project gen-lang-client-0982515821 --non-interactive

      - name: Sincronizar Backend no Render e Verificar Estado da API
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "Deploy Hook do Render acionado com sucesso."
          else
            echo "RENDER_DEPLOY_HOOK_URL opcional não definido; atualização via Git autoDeploy do Render."
          fi
          curl -fsSL --max-time 25 "https://sila-billing.onrender.com/api/health" || echo "Backend Render em aquecimento (cold start)."
