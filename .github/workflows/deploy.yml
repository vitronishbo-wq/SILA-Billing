name: Automação Total SILA-Billing

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar o Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configurar Node.js 24 (Firebase CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar Dependências e Gerar Build PWA
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || secrets.VITE_API_BASE_URL }}
        run: |
          bun install
          bun run build

      - name: Descodificar Chave Privada do Firebase (Segurança Node 24)
        shell: bash
        run: |
          # Remove espaços ou quebras de linha ocultas e cria o arquivo local limpo
          cat << 'EOF' > b64_temp.txt
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ID }}
          EOF

          # Remove qualquer quebra de linha interna da string antes de decodificar
          tr -d '\r\n ' < b64_temp.txt > b64_clean.txt

          # Decodifica para o arquivo final esperado pela CLI do Firebase
          base64 -d b64_clean.txt > gcp_key.json

          # Garante a permissão correta de leitura do arquivo
          chmod 600 gcp_key.json
          rm -f b64_temp.txt b64_clean.txt

      - name: Deploy para o Firebase Hosting e Regras do Firestore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp_key.json
        run: |
          npx --yes firebase-tools@latest deploy --only hosting,firestore:rules --project gen-lang-client-0982515821

      - name: Limpar Chave Temporária
        if: always()
        run: rm -f gcp_key.json

      - name: Disparar Atualização Automática no Render
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK_URL" ]; then
            curl -fsSL -X POST "$HOOK_URL"
            echo "Deploy Hook do Render disparado com sucesso."
          else
            echo "RENDER_DEPLOY_HOOK_URL não definido (o Render já atualiza automaticamente via GitHub autoDeploy)."
          fi
